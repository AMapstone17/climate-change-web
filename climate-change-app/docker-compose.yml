services:
  # flask web application
  web:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env.docker.local
    restart: unless-stopped
    depends_on:
      - db

  # postgres database
  db:
    image: postgres:alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env.docker.local
    ports:
      - "5432:5432"
    restart: unless-stopped

  
  # simple database viewer
  adminer:
    image: adminer
    ports:
      - "5001:8080"
    environment:
      ADMINER_DESIGN: "hydra"
    restart: unless-stopped


volumes:
  pgdata: