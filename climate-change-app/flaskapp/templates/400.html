
{% extends "base.html" %}
{% block extra_css %}
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/error_style.css') }}">
{% endblock %}
{% block content %}
    <div class="msgBox">
        <h2>Error 400 - Bad Request</h2>
        <img class="error-image" src="{{ url_for('static', filename='error-tree.png') }}" alt="Placeholder Image">
        <p>A bad request was made to the server.</p>
        <p>This could be due to invalid or malformed request syntax.</p>
        <a href="https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/400" target="_blank">Learn more about the 400 Bad Request error</a>
    </div>
{% endblock %}
