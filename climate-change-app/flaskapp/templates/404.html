
{% extends "base.html" %}

{% block extra_css %}
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/error_style.css') }}">
{% endblock %}

{% block content %}

    <div class="msgBox">
        <h2>Error 404 - Not Found</h2>
        <img class="error-image" src="{{ url_for('static', filename='error-tree.png') }}" alt="Placeholder Image">
        <p>The requested resource could not be found on the server.</p>
        <p>The URL you requested does not exist.</p>
        <a href="https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/404" target="_blank">Learn more about the 404 Not Found error</a>
    </div>
{% endblock %}
