
{% extends "base.html" %}
{% block extra_css %}
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/error_style.css') }}">
{% endblock %}
{% block content %}
    <div class="msgBox">
        <h2>Error 403 - Forbidden</h2>
        <img class="error-image" src="{{ url_for('static', filename='error-tree.png') }}" alt="Placeholder Image">
        <p>Access to the requested resource is forbidden.</p>
        <p>You do not have permission to access this resource.</p>
        <a href="https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/403" target="_blank">Learn more about the 403 Forbidden error</a>
    </div>
{% endblock %}
